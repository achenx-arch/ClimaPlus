# =====================================================================
#  ClimaPlus – Entrega continua (Fase 9)
#  Cuando la CI de main termina bien, publica las imágenes en GitHub Container Registry:
#    ghcr.io/<usuario>/climaplus-api:latest y :<commit>
#    ghcr.io/<usuario>/climaplus-web:latest y :<commit>
#  No necesita secretos adicionales: usa el GITHUB_TOKEN del propio workflow.
#  La URL pública de la API para el frontend se toma de la variable del repositorio API_PUBLIC_URL
#  (Settings → Secrets and variables → Actions → Variables).
# =====================================================================
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Publicar imagen ${{ matrix.nombre }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - nombre: climaplus-api
            contexto: ./backend
          - nombre: climaplus-web
            contexto: ./frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.nombre }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.API_PUBLIC_URL || 'http://localhost:8080' }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
