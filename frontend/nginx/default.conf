# ClimaPlus – Nginx para la SPA de React (Fase 9).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;          # no anunciar la versión de Nginx
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash en el nombre: caché de un año.
    location /assets/ {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html nunca en caché, para que cada despliegue se vea de inmediato.
    location = /index.html {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Rutas de React Router (/dashboard, /dispositivos/5…): siempre devuelven index.html.
    location / {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Nunca servir archivos ocultos (.env, .git…).
    location ~ /\. {
        deny all;
        return 404;
    }
}
