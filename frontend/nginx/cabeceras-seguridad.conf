# Cabeceras de seguridad del frontend (Fase 8/9, OWASP A05). Se incluyen en cada location porque
# add_header no se hereda cuando una location define sus propias cabeceras.
# La CSP completa va en la etiqueta <meta> que genera Vite; frame-ancestors solo funciona como cabecera.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# strict-origin-when-cross-origin (fase 6): Google Identity Services necesita el origen del sitio; solo viaja el
# origen, nunca la ruta ni la consulta.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# same-origin-allow-popups (fase 6): el popup de "Continuar con Google" debe poder devolver la respuesta a la página.
# Sigue aislando la ventana de cualquier otro sitio que la abra.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Activar solo cuando el sitio se sirva por HTTPS (detrás del proxy con certificado):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
