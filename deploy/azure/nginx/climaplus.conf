# =====================================================================
#  ClimaPlus – Nginx en la VM de Azure (Ubuntu 24.04): frontend React (SPA) + proxy inverso a la API.
#  Instalar (reemplaza <DOMINIO> primero; ver docs/despliegue/azure-vm.md):
#    sudo cp climaplus.conf /etc/nginx/sites-available/climaplus
#    sudo ln -s /etc/nginx/sites-available/climaplus /etc/nginx/sites-enabled/climaplus
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#  Requiere el certificado de Let's Encrypt en /etc/letsencrypt/live/<DOMINIO>/ y el snippet
#  /etc/nginx/snippets/climaplus-cabeceras.conf (copia de frontend/nginx/cabeceras-seguridad.conf con HSTS activado).
# =====================================================================

# HTTP: solo renovación de certificados y redirección a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name <DOMINIO>;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Cualquier otro nombre o la IP directa: se rechaza (evita que la API responda a Host falsos).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    # Ubuntu 24.04 trae Nginx 1.24: http2 va en "listen" (la directiva "http2 on" es de 1.25+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <DOMINIO>;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/<DOMINIO>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMINIO>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;   # igual que el límite de Kestrel

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------ API (ASP.NET Core en 127.0.0.1:5000)
    # La API pone sus propias cabeceras de seguridad (y HSTS al ver X-Forwarded-Proto: https).
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Una sola entrada con la IP real del cliente (no se reenvía lo que mande el cliente).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Swagger solo existe en Development; en producción no se expone.
    location /swagger { return 404; }

    # ------------------------------------------------------------ Frontend (npm run build → /var/www/climaplus/frontend)
    root /var/www/climaplus/frontend;
    index index.html;

    location /assets/ {
        include /etc/nginx/snippets/climaplus-cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/climaplus-cabeceras.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Rutas de React Router (/dashboard, /dispositivos/5…): siempre index.html.
    location / {
        include /etc/nginx/snippets/climaplus-cabeceras.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Nunca servir archivos ocultos (.env, .git…).
    location ~ /\. {
        deny all;
        return 404;
    }
}
